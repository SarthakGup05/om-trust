<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5D42" />
      <stop offset="100%" stop-color="#143B2B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C284" />
      <stop offset="100%" stop-color="#D98B3A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Inner Subtle Accent Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#D98B3A" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Sacred Om (ॐ) Symbol -->
  <text
    x="32"
    y="42"
    font-family="'Segoe UI', 'Noto Sans Devanagari', 'Mangal', 'Arial Unicode MS', sans-serif"
    font-size="34"
    font-weight="bold"
    fill="url(#goldGrad)"
    text-anchor="middle"
    filter="url(#glow)"
  >ॐ</text>
</svg>